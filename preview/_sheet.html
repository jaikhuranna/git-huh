<!doctype html>
<html><head><meta charset="utf-8"><title>contact sheet</title>
<style>
  body { margin: 0; background: #C9C7C2; font: 500 11px/1 'IBM Plex Mono', monospace; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 10px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cell b { font-weight: 500; color: #3a3a38; letter-spacing: .08em; }
  .shell { width: 244px; height: 529px; overflow: hidden; border-radius: 10px; background: #F2F0EB; }
  iframe {
    width: 393px; height: 852px; border: 0; display: block;
    transform: scale(0.621); transform-origin: top left;
  }
  .miss { display: grid; place-items: center; height: 100%; color: #8a8884; }
</style></head>
<body>
<div class="grid" id="grid"></div>
<script>
const SCREENS = [
  ['hey','hey.html'], ['now','now.html'], ['flow','flow.html'],
  ['poster','poster.html'], ['orbit','orbit.html'], ['weather','weather.html'],
  ['cards','cards.html'], ['index','index-screen.html'], ['dots','dots.html'],
  ['archive','archive.html'],
];
document.getElementById('grid').innerHTML = SCREENS.map(([name, file]) => `
  <div class="cell">
    <b>${name}</b>
    <div class="shell"><iframe src="${file}?v=${Date.now()}" title="${name}"></iframe></div>
  </div>`).join('');
</script>
</body></html>
