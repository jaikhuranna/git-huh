<!doctype html>
<html><head><meta charset="utf-8"><title>orbit</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="shell.css">
<style>
  .screen { padding: 4px var(--gutter) 0; }
  .head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 14px; }
  .head .label:first-child { color: var(--ink); }
  .stage { display: flex; justify-content: center; }
  .legend { margin-top: 18px; }
  .lrow {
    display: flex; align-items: center; gap: 10px;
    border-top: 1px solid var(--hair); padding: 7px 0;
  }
  .lrow i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .lrow .n { flex: 1; }
  .lrow .s { color: var(--ink40); }
</style></head>
<body><div class="phone"><div class="screen" id="s"></div></div>
<script type="module">
import { model, chrome } from './data.js';
const c = chrome('orbit');
document.querySelector('.phone').insertAdjacentHTML('afterbegin', c.header);
document.querySelector('.phone').insertAdjacentHTML('beforeend', c.rail);

const size = Math.min(393 - 40, 330);
const cx = size/2, cy = size/2;
const langs = model.languages.slice(0, 14);
const lum = hex => { const n = parseInt(hex.slice(1),16);
  return (((n>>16)&255)*299 + ((n>>8)&255)*587 + (n&255)*114)/1000; };

const arcPath = (r, a0, a1) => {
  const p = d => { const rad = d*Math.PI/180; return `${cx+Math.cos(rad)*r} ${cy+Math.sin(rad)*r}`; };
  return `M${p(a0)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${p(a1)}`;
};

let svg = '';
[size*0.16, size*0.29, size*0.42].forEach((r, ring) => {
  // Broken, spiralling arcs — not closed circles.
  const start = -120 + ring*28, sweep = 250;
  svg += `<path d="${arcPath(r, start, start+sweep)}" fill="none" stroke="var(--ink)" stroke-width="1" opacity=".35"/>`;
  const onRing = langs.filter((_, i) => i % 3 === ring);
  onRing.forEach((l, i) => {
    const t = onRing.length > 1 ? i/(onRing.length-1) : .5;
    const a = (start + 20 + t*(sweep-40)) * Math.PI/180;
    const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
    const rank = langs.indexOf(l), letter = l.name[0].toUpperCase();
    if (rank < 6) {
      // Top languages lift out into filled chips, squares and circles alternating.
      const chip = 15;
      svg += rank % 2 === 0
        ? `<rect x="${x-chip}" y="${y-chip}" width="${chip*2}" height="${chip*2}" fill="${l.color}"/>`
        : `<circle cx="${x}" cy="${y}" r="${chip}" fill="${l.color}"/>`;
      svg += `<text x="${x}" y="${y+5}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="15"
        fill="${lum(l.color)>150?'var(--ink)':'var(--on-black)'}">${letter}</text>`;
    } else {
      svg += `<text x="${x}" y="${y+5}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="15"
        fill="var(--ink)">${letter}</text>`;
    }
  });
});

document.getElementById('s').innerHTML = `
  <div class="head"><span class="label">languages</span><span class="label">${model.languages.length} in play</span></div>
  <div class="stage"><svg width="${size}" height="${size}">${svg}</svg></div>
  <div class="legend">${model.languages.slice(0,7).map(l => `
    <div class="lrow"><i style="background:${l.color}"></i>
      <span class="data n">${l.name}</span>
      <span class="data s">${(l.share*100).toFixed(1)}%</span></div>`).join('')}</div>`;
</script></body></html>
