<!doctype html>
<html><head><meta charset="utf-8"><title>dots</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="shell.css">
<style>
  .phone { background: #FCFBF8; }
  .rail { background: #FCFBF8; }
  .screen { padding: 4px var(--gutter) 0; }
  .head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 12px; }
  .head .label:first-child { color: var(--ink); }
  .foot { margin-top: 14px; }
</style></head>
<body><div class="phone"><div class="screen" id="s"></div></div>
<script type="module">
import { model, chrome, fmt } from './data.js';
const c = chrome('dots');
document.querySelector('.phone').insertAdjacentHTML('afterbegin', c.header);
document.querySelector('.phone').insertAdjacentHTML('beforeend', c.rail);

function hash(s) {
  let v = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { v ^= s.charCodeAt(i); v = Math.imul(v, 0x01000193) >>> 0; }
  return v;
}

const W = 393 - 40, H = 470;
const days = model.days;
const cols = Math.ceil(days.length / 7);
const stepX = W / cols, stepY = H / 7;
const { startIndex, endIndex } = model.insights.longestStreakRange;

// A little stable jitter, so the field scatters like the pin's rather than
// betraying the grid underneath it.
const point = i => {
  const seed = hash(String(i));
  return {
    x: Math.floor(i/7)*stepX + stepX/2 + ((seed%100)/100 - .5)*stepX*.5,
    y: (i%7)*stepY + stepY/2 + (((seed>>8)%100)/100 - .5)*stepY*.45,
  };
};

let path = [];
for (let i = startIndex; i <= endIndex; i++) { const p = point(i); path.push(`${p.x},${p.y}`); }

let svg = path.length > 1
  ? `<polyline points="${path.join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1"/>` : '';

days.forEach((d, i) => {
  const { x, y } = point(i);
  if (d.level === 0) { svg += `<circle cx="${x}" cy="${y}" r="1.5" fill="var(--ink)" opacity=".2"/>`; return; }
  const r = 3 + d.level;
  svg += `<circle cx="${x}" cy="${y}" r="${r}" fill="var(--ink)"/>`;
  svg += (i >= startIndex && i <= endIndex)
    ? `<text x="${x}" y="${y+2.2}" text-anchor="middle" font-family="IBM Plex Mono" font-size="6" fill="var(--on-black)">${i-startIndex+1}</text>`
    : `<text x="${x+r+1.5}" y="${y+2}" font-family="IBM Plex Mono" font-size="6" fill="var(--ink70)">${d.count}</text>`;
});

document.getElementById('s').innerHTML = `
  <div class="head"><span class="label">join the dots</span><span class="label">streak ${model.insights.longestStreak}</span></div>
  <svg width="${W}" height="${H}">${svg}</svg>
  <div class="label foot">${fmt(model.total)} contributions · best day ${fmt(model.insights.bestDay)} · ${fmt(model.insights.activeDays)} active days</div>`;
</script></body></html>
