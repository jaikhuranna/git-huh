<!doctype html>
<html><head><meta charset="utf-8"><title>cards</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="shell.css">
<style>
  .screen { padding: 4px var(--gutter) 0; overflow-y: auto; }
  .head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 14px; }
  .head .label:first-child { color: var(--ink); }
  .deck { display: flex; flex-direction: column; align-items: center; padding-bottom: 30px; }
  .card {
    background: var(--black); border-radius: var(--r-card); padding: 18px;
    width: 100%; text-decoration: none; display: block;
    box-shadow: 0 10px 26px rgba(0,0,0,.22);
  }
  .card + .card { margin-top: -58px; }
  .chead { display: flex; align-items: center; gap: 10px; }
  .handle { color: var(--on-black); font: 400 13px/1 var(--mono); }
  .meta { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  .meta span { color: var(--on-black-55); font: 400 10px/1 var(--mono); }
  .lang { display: flex; align-items: center; gap: 5px; }
  .lang i { width: 7px; height: 7px; border-radius: 50%; }
</style></head>
<body><div class="phone"><div class="screen" id="s"></div></div>
<script type="module">
import { model, chrome, fmt, age } from './data.js';
const c = chrome('cards');
document.querySelector('.phone').insertAdjacentHTML('afterbegin', c.header);
document.querySelector('.phone').insertAdjacentHTML('beforeend', c.rail);

function hash(s) {
  let v = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { v ^= s.charCodeAt(i); v = Math.imul(v, 0x01000193) >>> 0; }
  return v;
}

/** The four board primitives, arranged by a hash of the repository name. */
function sigil(seed, size) {
  const tile = size/2, off = (seed >> 1) & 3;
  let out = '';
  for (let i = 0; i < 4; i++) {
    const slot = (i + off) & 3;
    const L = (slot & 1) * tile, T = (slot >> 1) * tile;
    const turn = (seed >> (i*2+3)) & 3;
    if (i === 0) {
      out += `<path d="M${L} ${T+tile} L${L} ${T} L${L+tile} ${T} A${tile} ${tile} 0 0 1 ${L} ${T+tile} Z" fill="var(--on-black)"/>`;
    } else if (i === 1) {
      const r = tile*.14, sp = tile*.22, h = turn % 2 === 0;
      out += `<circle cx="${L+tile/2-(h?sp:0)}" cy="${T+tile/2-(h?0:sp)}" r="${r}" fill="var(--on-black)"/>`;
      out += `<circle cx="${L+tile/2+(h?sp:0)}" cy="${T+tile/2+(h?0:sp)}" r="${r}" fill="var(--on-black)"/>`;
    } else if (i === 2) {
      const r = tile*.4, x = L+tile/2, y = T+tile/2;
      out += `<path d="M${x-r} ${y} A${r} ${r} 0 0 1 ${x+r} ${y} Z" fill="var(--on-black)"/>`;
    } else {
      out += `<circle cx="${L+tile/2}" cy="${T+tile/2}" r="${tile*.3}" fill="var(--on-black)"/>`;
    }
  }
  return `<svg width="${size}" height="${size}">${out}</svg>`;
}

/** White dots sized by activity; peak cells go square, as in the pin. */
function halftone(repo, seed, width) {
  const rows = 7, cols = Math.floor(width/9), pitch = width/cols;
  const days = Math.max(0, (Date.parse('2026-09-19') - Date.parse(repo.pushedAt)) / 86400000);
  const vigour = Math.max(.18, 1 - days/240);
  const R = [.7,1.2,1.8,2.4], A = [.1,.3,.55,.8];
  let out = '';
  for (let cc = 0; cc < cols; cc++) for (let r = 0; r < rows; r++) {
    const level = Math.min(4, Math.floor((hash(`${seed}:${cc}:${r}`) % 1000)/1000 * 5 * vigour));
    const x = cc*pitch + pitch/2, y = r*7.6 + 4;
    out += level === 4
      ? `<rect x="${x-2.2}" y="${y-2.2}" width="4.4" height="4.4" fill="var(--on-black)"/>`
      : `<circle cx="${x}" cy="${y}" r="${R[level]}" fill="var(--on-black)" opacity="${A[level]}"/>`;
  }
  return `<svg width="${width}" height="54">${out}</svg>`;
}

const cardW = 393 - 40 - 12;
document.getElementById('s').innerHTML = `
  <div class="head"><span class="label">repositories</span><span class="label">${fmt(model.repoCount)} owned</span></div>
  <div class="deck">${model.repos.map(repo => {
    const seed = hash(repo.nameWithOwner);
    const tilt = ((seed % 5) - 2) * 0.9;
    return `<a class="card" href="#" style="transform:rotate(${tilt}deg)">
      <div class="chead">${sigil(seed, 26)}<span class="handle">~${repo.owner}-${repo.name}</span></div>
      ${halftone(repo, seed, cardW - 36)}
      <div class="meta">
        <span>★ ${fmt(repo.stars)}</span><span>⑂ ${fmt(repo.forks)}</span>
        <span class="lang"><i style="background:${repo.language.color}"></i>${repo.language.name}</span>
        <span>${age(repo.pushedAt)}</span>${repo.isPrivate ? '<span>private</span>' : ''}
      </div></a>`;
  }).join('')}</div>`;
</script></body></html>
